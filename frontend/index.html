    <meta property="og:type" content="website" />

    <meta
      property="og:title"
      content="FoodExpress | Food Delivery"

    <meta
      property="og:description"
      content="Order shawarma, mandi, kebabs & more from the best restaurants in Coimbatore. Free delivery above ₹299. Arabic cuisine with an Indian twist."
    />

    <!-- ─── Twitter Card ─── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@FoodExpress" />
    <meta
      name="twitter:title"
      content="FoodExpress – Order Food Online in Coimbatore"
    />
    <meta
      name="twitter:description"
      content="Authentic Arabic cuisine & fast food delivery in Coimbatore. Shawarma, Mandi, Kebabs & more!"
    />
    <meta name="twitter:image" content="https://foodexpress.in/og-image.png" />

    <!-- ─── Google Fonts Preconnect (for faster load) ─── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- ─── Structured Data (JSON-LD) for SEO ─── -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FoodEstablishment",
        "name": "FoodExpress",
        "description": "Online food delivery platform for Arabic cuisine in Coimbatore",
        "url": "https://foodexpress.in",
        "servesCuisine": ["Arabic", "Indian", "Mediterranean"],
        "priceRange": "₹₹",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Coimbatore",
          "addressRegion": "Tamil Nadu",
          "addressCountry": "IN"
        },
        "telephone": "+91-96290-75139",
        "openingHours": "Mo-Su 11:00-23:00"
      }
    </script>

    <!-- ─── Prevent white flash on dark background ─── -->
    <style>
      html,
      body,
      #root {
        background-color: #0d0d0d;
        color: #ffffff;
        margin: 0;
        padding: 0;
      }

      /* Loading spinner shown before React mounts */
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 16px;
        background: #0d0d0d;
        z-index: 9999;
        transition: opacity 0.4s ease;
      }
      #initial-loader.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .loader-logo {
        font-size: 48px;
        animation: loader-bounce 1s ease-in-out infinite;
      }
      .loader-text {
        font-family: "Nunito", "Inter", sans-serif;
        font-size: 20px;
        font-weight: 900;
        color: #c9a84c;
        letter-spacing: 2px;
      }
      .loader-bar {
        width: 160px;
        height: 3px;
        background: #1a1a1a;
        border-radius: 2px;
        overflow: hidden;
      }
      .loader-bar-fill {
        height: 100%;
        background: linear-gradient(90deg, #c9a84c, #fc8019, #c9a84c);
        background-size: 200% 100%;
        border-radius: 2px;
        animation: loader-slide 1.5s ease-in-out infinite;
      }
      @keyframes loader-bounce {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-10px);
        }
      }
      @keyframes loader-slide {
        0% {
          background-position: -200% 0;
          width: 0%;
        }
        50% {
          background-position: 100% 0;
          width: 80%;
        }
        100% {
          background-position: 200% 0;
          width: 100%;
        }
      }
    </style>
  </head>

  <body>
    <!-- ─── Splash loader (removed once React hydrates) ─── -->
    <div id="initial-loader">
      <div class="loader-logo">🥙</div>
      <div class="loader-text">FOODEXPRESS</div>
      <div class="loader-bar">
        <div class="loader-bar-fill"></div>
      </div>
    </div>

    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>

    <!-- Razorpay Checkout SDK -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <!-- Hide loader once React mounts -->
    <script>
      window.addEventListener("DOMContentLoaded", function () {
        // Wait for React to render
        const observer = new MutationObserver(function () {
          const root = document.getElementById("root");
          if (root && root.children.length > 0) {
            const loader = document.getElementById("initial-loader");
            if (loader) {
              loader.classList.add("hidden");
              setTimeout(function () {
                loader.remove();
              }, 500);
            }
            observer.disconnect();
          }
        });
        observer.observe(document.getElementById("root"), {
          childList: true,
          subtree: true,
        });
      });
    </script>
  </body>
</html>
