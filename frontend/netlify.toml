[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Proxy all /api/* requests to the Railway backend
[[redirects]]
  from = "/api/*"
  to = "https://online-food-ordering-project-production.up.railway.app/api/:splat"
  status = 200
  force = true

# SPA fallback — serve index.html for all other routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
